<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>As Aventuras de Robojão</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="cabecalho">
    <h1 id="titulo"></h1>
  </header>

  <main class="jogo">
    <div class="area-tabuleiro">
      <section id="tabuleiro" aria-label="Tabuleiro"></section>
    </div>

    <aside class="painel">
      <h2>Comandos</h2>
      <p id="aviso-lista-vazia">Ainda não há comandos.</p>
      <ol id="lista-de-comandos"></ol>
      <button id="botao-iniciar" type="button">INICIAR</button>
    </aside>
  </main>

  <div id="mensagem-final" class="mensagem-final" hidden>
    <p id="frase-final"></p>
    <p id="motivo-final"></p>
    <button id="botao-jogar-de-novo" type="button">JOGAR DE NOVO</button>
  </div>

  <script src="jogo.js"></script>
</body>
</html>
